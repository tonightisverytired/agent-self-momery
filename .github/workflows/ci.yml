name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout info
        run: |
          Write-Host "GITHUB_SHA=$env:GITHUB_SHA"
          git rev-parse HEAD
          git log --oneline -1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector,server,mcp,llm]"
      - name: Dependency check
        run: |
          python -c "import requests; print('requests', requests.__version__)"
          python -m pip show requests | Select-String -Pattern 'Name|Version'
      - name: Pytest
        run: python -m pytest --tb=short
      - name: Gate check (fixed snapshot)
        run: python tools/gate_check.py
